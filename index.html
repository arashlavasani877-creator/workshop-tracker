<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>راسپینا | کنترل پروژه ساختمان</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0B1220">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="راسپینا">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0B1220; --panel:#121B2E; --panel-2:#182337; --line:#25324A;
    --ink:#EEF1F6; --ink-soft:#8E9BB3; --ink-faint:#576076;
    --gold:#D8B54C; --gold-dim:#D8B54C22;
    --steel:#6E8CAE; --steel-dim:#6E8CAE22;
    --green:#5FAE7B; --green-dim:#5FAE7B22;
    --red:#E2685C; --red-dim:#E2685C22;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; overflow-x:hidden; max-width:100%;}
  body{ background:var(--bg); color:var(--ink); font-family:'Vazirmatn',sans-serif; min-height:100vh; padding-bottom:40px; }
  header{ background:linear-gradient(135deg,#0E1830,#0B1220 60%); padding:20px 18px 18px; border-bottom:1px solid var(--line); position:relative; }
  header::after{ content:""; position:absolute; right:0; bottom:-1px; width:64px; height:3px; background:var(--gold); border-radius:3px 3px 0 0; }
  .head-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .head-left{ display:flex; align-items:center; gap:10px; min-width:0; flex:1 1 auto; overflow:hidden; }
  header img.logo{ width:38px; height:38px; border-radius:12px; object-fit:cover; flex-shrink:0; box-shadow:0 0 0 1.5px var(--gold); }
  header h1{ margin:0; font-size:14px; font-weight:800; line-height:1.35; }
  header p{ margin:4px 0 0; font-size:11px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .role-badge{ font-family:'JetBrains Mono',monospace; font-size:10px; padding:4px 10px; border-radius:20px; background:var(--gold-dim); color:var(--gold); white-space:nowrap; }
  .signout-btn{ background:none; border:1px solid var(--line); color:var(--ink-soft); font-size:11px; padding:6px 12px; border-radius:20px; font-family:'Vazirmatn'; cursor:pointer; margin-inline-start:6px; }
  .back-btn{ background:none; border:1px solid var(--line); color:var(--ink-soft); font-size:11px; padding:6px 12px; border-radius:20px; font-family:'Vazirmatn'; cursor:pointer; }
  .wrap{ max-width:640px; margin:0 auto; padding:0 14px; }

  #splashScreen{ position:fixed; inset:0; z-index:999; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; transition:opacity .35s ease; }
  #splashScreen.hide{ opacity:0; pointer-events:none; }
  #splashScreen img{ width:84px; height:84px; border-radius:22px; object-fit:cover; box-shadow:0 0 0 2px var(--gold); }
  #splashScreen .splash-title{ font-size:16px; font-weight:900; }
  #splashScreen .splash-spinner{ width:26px; height:26px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--gold); animation:splash-spin .8s linear infinite; }
  @keyframes splash-spin{ to{ transform:rotate(360deg); } }

  .center-screen{ min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px 20px; gap:14px; }
  .center-screen img{ width:76px; height:76px; border-radius:18px; object-fit:cover; box-shadow:0 0 0 2px var(--gold); }
  .center-screen h2{ margin:0; font-size:17px; }
  .center-screen p{ margin:0; font-size:13px; color:var(--ink-soft); max-width:340px; line-height:1.9; }

  .auth-input{ width:100%; max-width:320px; font-family:'Vazirmatn',sans-serif; font-size:14px; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:var(--panel-2); color:var(--ink); margin-bottom:10px; }
  .auth-btn{ width:100%; max-width:320px; background:var(--gold); color:#241C05; border:none; padding:12px 20px; border-radius:12px; font-family:'Vazirmatn'; font-weight:800; font-size:14px; cursor:pointer; margin-top:6px; }
  .auth-btn:disabled{ opacity:.6; cursor:default; }
  .auth-error{ color:var(--red); font-size:12.5px; max-width:320px; line-height:1.8; margin-top:2px; }

  .section-title{ font-size:13px; font-weight:900; margin:20px 0 10px; color:var(--ink-soft); }
  .card{ background:var(--panel); border:1px solid var(--line); border-inline-start:3px solid var(--gold); border-radius:16px; margin-bottom:12px; padding:16px; }
  .card.flat{ border-inline-start:1px solid var(--line); }
  .card-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; }
  .card-title{ font-weight:800; font-size:15px; }
  .card-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .chip{ font-family:'JetBrains Mono',monospace; font-size:10px; padding:4px 10px; border-radius:20px; background:var(--panel-2); color:var(--ink-faint); border:1px solid var(--line); white-space:nowrap; }
  .chip.off{ background:var(--red-dim); color:var(--red); border-color:transparent; }
  .arrow{ color:var(--ink-faint); font-size:16px; flex-shrink:0; }

  .btn-primary{ background:var(--gold); color:#241C05; border:none; font-family:'Vazirmatn'; font-weight:800; font-size:13.5px; padding:12px 18px; border-radius:24px; cursor:pointer; }
  .btn-secondary{ background:var(--panel-2); color:var(--ink); border:1px solid var(--line); font-family:'Vazirmatn'; font-weight:700; font-size:12.5px; padding:9px 14px; border-radius:20px; cursor:pointer; }
  .btn-danger{ background:none; border:none; color:var(--red); font-size:12px; cursor:pointer; text-decoration:underline; font-family:'Vazirmatn'; }
  .fab{ position:fixed; left:18px; bottom:18px; background:var(--gold); color:#241C05; border:none; padding:14px 20px; border-radius:30px; font-family:'Vazirmatn'; font-weight:800; font-size:13.5px; box-shadow:0 6px 18px rgba(0,0,0,.4); cursor:pointer; z-index:20; }

  .field-label{ font-size:11.5px; color:var(--ink-soft); margin:0 0 6px; display:block; }
  .field-input{ width:100%; font-family:'Vazirmatn'; font-size:13.5px; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; background:var(--panel-2); color:var(--ink); margin-bottom:12px; }
  select.field-input{ appearance:none; }
  .row-2{ display:flex; gap:10px; }
  .row-2 > *{ flex:1; min-width:0; }
  .subcard{ background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .subcard-head{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
  .icon-btn{ background:none; border:none; color:var(--ink-faint); font-size:16px; cursor:pointer; padding:2px 6px; }
  .summary-strip{ display:flex; justify-content:space-around; background:var(--gold-dim); border-radius:14px; padding:14px; margin:16px 0; }
  .summary-item{ text-align:center; }
  .summary-num{ font-family:'JetBrains Mono',monospace; font-size:19px; font-weight:800; color:var(--gold); }
  .summary-label{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; }

  .tree-block{ margin-bottom:6px; }
  .tree-head{ display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--panel-2); border-radius:10px; cursor:pointer; font-size:13px; font-weight:700; }
  .tree-body{ padding:6px 0 6px 14px; display:none; }
  .tree-body.open{ display:block; }
  .tree-floor{ display:flex; align-items:center; gap:8px; padding:8px 10px; font-size:12.5px; color:var(--ink-soft); border-bottom:1px dashed var(--line); }
  .tree-floor:last-child{ border-bottom:none; }
  .tree-floor .cnt{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-faint); margin-inline-start:auto; }

  .module-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .module-tile{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 12px; text-align:center; cursor:pointer; }
  .module-tile .em{ font-size:26px; margin-bottom:8px; }
  .module-tile .lbl{ font-size:12.5px; font-weight:700; }

  .sync-note{ text-align:center; font-size:10.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; margin:14px 0 4px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--green); }
  .dot.off{ background:var(--red); }
</style>
</head>
<body>

<div id="splashScreen">
  <img src="./icon-192.png" alt="راسپینا">
  <div class="splash-title">راسپینا — کنترل پروژه</div>
  <div class="splash-spinner"></div>
</div>

<header>
  <div class="wrap">
    <div class="head-row">
      <div class="head-left">
        <img class="logo" src="./icon-192.png" alt="راسپینا">
        <div>
          <h1>کنترل پروژه ساختمان</h1>
          <p id="headerSub">راسپینا</p>
        </div>
      </div>
      <div id="headerRight" style="display:flex; align-items:center; gap:6px;"></div>
    </div>
  </div>
</header>

<div class="wrap" id="app">
  <div class="center-screen">
    <span class="sync-note"><span class="dot" id="statusDot"></span><span id="syncNote">در حال اتصال…</span></span>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js"></script>
<script src="./app.js"></script>

</body>
</html>
