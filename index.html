<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>افراچوب | تابلوی کنترل کارگاه</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#15171A">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="افراچوب">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15171A; --panel:#1D2024; --panel-2:#22262B; --line:#2C3138;
    --ink:#EDEDEC; --ink-soft:#9198A0; --ink-faint:#5C636B;
    --amber:#E3A857; --amber-dim:#E3A85722;
    --teal:#4FD1C5; --teal-dim:#4FD1C522;
    --green:#5FAE7B; --red:#E2685C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Vazirmatn',sans-serif;
    min-height:100vh; padding-bottom:40px;
  }
  header{ background:linear-gradient(180deg,#1A1D21,#15171A); padding:22px 18px 26px; border-bottom:1px solid var(--line); position:relative; }
  header h1{ margin:0; font-size:20px; font-weight:900; letter-spacing:.2px; }
  header p{ margin:6px 0 0; font-size:12.5px; color:var(--ink-soft); }
  .eyebrow{ display:inline-block; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:1.5px; color:var(--amber); background:var(--amber-dim); padding:3px 8px; border-radius:3px; margin-bottom:8px; }
  .wrap{ max-width:640px; margin:0 auto; padding:0 14px; }
  .toolbar{ display:flex; gap:8px; margin:-14px 0 16px; position:relative; z-index:2; }
  .toolbar button{ flex:1; border:none; cursor:pointer; font-family:'Vazirmatn',sans-serif; font-weight:700; font-size:13.5px; padding:12px 10px; border-radius:10px; }
  .btn-primary{ background:var(--amber); color:#191300; }
  .btn-secondary{ background:var(--panel); color:var(--ink); border:1px solid var(--line) !important; }
  #installBtn{ display:none; }
  .empty{ background:var(--panel); border:1.5px dashed var(--line); border-radius:14px; padding:32px 16px; text-align:center; color:var(--ink-soft); font-size:13.5px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; margin-bottom:14px; overflow:hidden; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px 10px; cursor:pointer; }
  .card-title{ display:flex; flex-direction:column; gap:3px; }
  .card-name{ font-weight:900; font-size:16px; }
  .card-sub{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft); }
  .stage-pill{ font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:20px; white-space:nowrap; background:var(--amber-dim); color:var(--amber); }
  .progress-strip{ height:5px; background:var(--line); margin:0 16px 14px; border-radius:3px; overflow:hidden; }
  .progress-strip > div{ height:100%; background:var(--amber); border-radius:3px; transition:width .3s; }
  .body-panel{ border-top:1px dashed var(--line); padding:14px 16px 16px; display:none; }
  .body-panel.open{ display:block; }

  .timeline{ position:relative; padding-inline-start:22px; margin-bottom:16px; }
  .tl-item{ position:relative; padding-bottom:16px; }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-item::before{ /* connecting line */
    content:""; position:absolute; top:20px; bottom:-4px; right:-16.5px; width:1.5px; background:var(--line);
  }
  .tl-item:last-child::before{ display:none; }
  .tl-dot{
    position:absolute; top:1px; right:-22px; width:13px; height:13px; border-radius:50%;
    background:var(--panel-2); border:2px solid var(--line);
  }
  .tl-dot.done{ background:var(--green); border-color:var(--green); }
  .tl-dot.active{ border-color:var(--amber); }
  .tl-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .tl-name{ font-size:13.5px; font-weight:700; }
  .tl-name.done{ color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--ink-faint); }
  .tl-time{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-faint); margin-top:2px; }
  .chk-btn{
    border:1.5px solid var(--line); background:var(--panel-2); color:var(--ink-soft);
    font-family:'Vazirmatn',sans-serif; font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:8px; cursor:pointer; white-space:nowrap;
  }
  .chk-btn.done{ background:var(--green)22; border-color:var(--green); color:var(--green); }

  .prog-box{ background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:8px; }
  .prog-row{ display:flex; align-items:center; gap:10px; }
  .prog-row input[type=range]{ flex:1; accent-color:var(--teal); }
  .prog-val{ font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--teal); min-width:34px; text-align:left; }
  .prog-date{ display:flex; align-items:center; gap:8px; margin-top:10px; }
  .prog-date label{ font-size:11px; color:var(--ink-soft); white-space:nowrap; }
  .prog-date input{
    flex:1; font-family:'JetBrains Mono',monospace; direction:ltr; text-align:center;
    background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:7px; padding:7px 8px; font-size:12.5px;
  }
  .prog-save{ margin-top:10px; width:100%; border:none; background:var(--teal); color:#0A2320; font-weight:700; font-size:12.5px; padding:9px; border-radius:8px; cursor:pointer; }
  .prog-strip-mini{ height:4px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:8px; }
  .prog-strip-mini > div{ height:100%; background:var(--teal); }

  .hist-title{ font-size:11px; color:var(--ink-soft); margin:16px 0 6px; font-weight:700; }
  .hist-item{ display:flex; justify-content:space-between; gap:8px; font-size:12px; padding:6px 0; border-bottom:1px solid var(--line); }
  .hist-item:last-child{ border-bottom:none; }
  .hist-time{ font-family:'JetBrains Mono',monospace; color:var(--ink-faint); font-size:10.5px; white-space:nowrap; }
  .del-row{ margin-top:14px; text-align:left; }
  .del-row button{ background:none; border:none; color:var(--red); font-size:11.5px; cursor:pointer; font-family:'Vazirmatn',sans-serif; text-decoration:underline; }

  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .modal-bg.open{ display:flex; }
  .modal{ background:var(--panel); width:100%; max-width:640px; border-radius:18px 18px 0 0; padding:20px 18px 26px; border-top:1px solid var(--line); }
  .modal h3{ margin:0 0 14px; font-size:15px; }
  .modal input{ width:100%; font-family:'Vazirmatn',sans-serif; font-size:14px; padding:11px 12px; border:1.5px solid var(--line); border-radius:9px; margin-bottom:10px; background:var(--panel-2); color:var(--ink); }
  .modal .row{ display:flex; gap:8px; margin-top:6px; }
  .modal .row button{ flex:1; border:none; padding:11px; border-radius:9px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:'Vazirmatn',sans-serif; }
  .save-btn{ background:var(--amber); color:#191300; }
  .cancel-btn{ background:var(--panel-2); color:var(--ink); }
  .sync-note{ text-align:center; font-size:10.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; margin:14px 0 4px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--green); }
  .dot.off{ background:var(--red); }
  .setup-warning{ background:#2A2115; border:1.5px solid var(--amber); border-radius:12px; padding:14px; font-size:12.5px; line-height:1.9; margin-bottom:16px; color:var(--ink); }
  .setup-warning b{ color:var(--amber); }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="eyebrow">افراچوب — تولید</div>
    <h1>تابلوی کنترل قراردادها</h1>
    <p>مراحل ساخت و نصب هر سفارش، همراه با درصد پیشرفت و تاریخ پیش‌بینی</p>
  </div>
</header>

<div class="wrap">
  <div id="configWarning" class="setup-warning" style="display:none;">
    <b>راه‌اندازی کامل نشده:</b> کلیدهای Firebase در فایل <code>firebase-config.js</code> هنوز جایگزین نشده‌اند.
  </div>

  <div class="toolbar">
    <button class="btn-primary" onclick="openAddModal()">+ قرارداد جدید</button>
  </div>
  <div class="toolbar">
    <button id="installBtn" class="btn-secondary" onclick="installApp()">نصب اپلیکیشن روی گوشی</button>
  </div>

  <div id="list"></div>
  <div class="sync-note"><span class="dot" id="statusDot"></span><span id="syncNote">در حال اتصال…</span></div>
</div>

<div class="modal-bg" id="addModalBg">
  <div class="modal">
    <h3>قرارداد جدید</h3>
    <input id="newName" placeholder="نام مشتری / کد قرارداد" />
    <div class="row">
      <button class="save-btn" onclick="addContract()">ثبت</button>
      <button class="cancel-btn" onclick="closeModal('addModalBg')">انصراف</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js"></script>

<script>
const STAGES = [
  { name: 'اندازه‌گیری', type: 'check' },
  { name: 'تایید طراحی', type: 'check' },
  { name: 'آنالیز', type: 'check' },
  { name: 'ساخت و برش', type: 'progress' },
  { name: 'ارسال بار به محل ساختمان', type: 'check' },
  { name: 'در حال نصب', type: 'progress' },
  { name: 'در انتظار تحویل‌دهی به مالک', type: 'check' },
  { name: 'خاتمه قرارداد', type: 'check' }
];

let contracts = [];
let openCardId = null;
let db = null;

function setStatus(text, ok){
  document.getElementById('syncNote').textContent = text;
  document.getElementById('statusDot').className = 'dot' + (ok ? '' : ' off');
}

try{
  if(!firebaseConfig || firebaseConfig.apiKey === 'PASTE_API_KEY_HERE'){
    document.getElementById('configWarning').style.display = 'block';
    setStatus('راه‌اندازی نشده', false);
  } else {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    db.collection('contracts').orderBy('createdAt', 'desc').onSnapshot((snap) => {
      contracts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      setStatus('همگام — لحظه‌ای', true);
      render();
    }, (err) => setStatus('خطا: ' + err.message, false));
  }
}catch(e){
  setStatus('خطا در راه‌اندازی: ' + e.message, false);
}

function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('fa-IR', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
}
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// current stage = first not-completed stage (check:not done, progress:percent<100)
function getCurrentIndex(c){
  const status = c.status || {};
  for(let i=0;i<STAGES.length;i++){
    const s = status[i] || {};
    if(STAGES[i].type === 'check' && !s.done) return i;
    if(STAGES[i].type === 'progress' && (s.percent||0) < 100) return i;
  }
  return STAGES.length - 1;
}
function isStageDone(status, i){
  const s = status[i] || {};
  if(STAGES[i].type === 'check') return !!s.done;
  return (s.percent||0) >= 100;
}
function overallPercent(c){
  const status = c.status || {};
  let sum = 0;
  STAGES.forEach((st,i) => {
    const s = status[i] || {};
    sum += st.type === 'check' ? (s.done ? 100 : 0) : (s.percent || 0);
  });
  return Math.round(sum / STAGES.length);
}

function render(){
  const list = document.getElementById('list');
  if(contracts.length === 0){
    list.innerHTML = '<div class="empty">هنوز قراردادی ثبت نشده. با دکمه «قرارداد جدید» شروع کنید.</div>';
    return;
  }
  list.innerHTML = contracts.map(c => {
    const status = c.status || {};
    const history = c.history || [];
    const curIdx = getCurrentIndex(c);
    const pct = overallPercent(c);
    const isOpen = openCardId === c.id;

    const timelineHtml = STAGES.map((st,i) => {
      const s = status[i] || {};
      const done = isStageDone(status, i);
      const dotCls = done ? 'done' : (i === curIdx ? 'active' : '');
      const nameCls = done ? 'done' : '';
      let control = '';
      if(st.type === 'check'){
        control = `<button class="chk-btn ${done?'done':''}" onclick="event.stopPropagation(); toggleCheck('${c.id}', ${i})">${done ? '✓ انجام شد' : 'ثبت انجام'}</button>`;
      }
      let progBox = '';
      if(st.type === 'progress'){
        const pv = s.percent || 0;
        const pd = s.predictedDate || '';
        progBox = `
          <div class="prog-box">
            <div class="prog-row">
              <input type="range" min="0" max="100" value="${pv}" id="range_${c.id}_${i}" oninput="document.getElementById('val_${c.id}_${i}').textContent = this.value + '%'">
              <span class="prog-val" id="val_${c.id}_${i}">${pv}%</span>
            </div>
            <div class="prog-strip-mini"><div style="width:${pv}%"></div></div>
            <div class="prog-date">
              <label>تاریخ پیش‌بینی پایان:</label>
              <input type="text" id="date_${c.id}_${i}" placeholder="1405/06/04" value="${escapeHtml(pd)}">
            </div>
            <button class="prog-save" onclick="event.stopPropagation(); saveProgress('${c.id}', ${i})">ثبت پیشرفت</button>
          </div>`;
      }
      const doneAt = s.doneAt || (st.type==='progress' && pv>=100 ? s.updatedAt : null);
      return `
        <div class="tl-item">
          <div class="tl-dot ${dotCls}"></div>
          <div class="tl-row">
            <span class="tl-name ${nameCls}">${st.name}</span>
            ${control}
          </div>
          ${s.doneAt ? `<div class="tl-time">${fmtTime(s.doneAt)}</div>` : ''}
          ${progBox}
        </div>`;
    }).join('');

    const histHtml = history.slice().reverse().slice(0,20).map(h =>
      `<div class="hist-item"><span>${escapeHtml(h.label)}</span><span class="hist-time">${fmtTime(h.time)}</span></div>`
    ).join('');

    return `
      <div class="card">
        <div class="card-head" onclick="toggleCard('${c.id}')">
          <div class="card-title">
            <span class="card-name">${escapeHtml(c.name)}</span>
            <span class="card-sub">مرحله فعلی: ${STAGES[curIdx].name}</span>
          </div>
          <span class="stage-pill">${pct}٪</span>
        </div>
        <div class="progress-strip"><div style="width:${pct}%"></div></div>
        <div class="body-panel ${isOpen ? 'open' : ''}">
          <div class="timeline">${timelineHtml}</div>
          <div class="hist-title">تاریخچه</div>
          ${histHtml || '<div class="hist-item"><span>—</span></div>'}
          <div class="del-row"><button onclick="event.stopPropagation(); deleteContract('${c.id}')">حذف قرارداد</button></div>
        </div>
      </div>`;
  }).join('');
}

function toggleCard(id){ openCardId = openCardId === id ? null : id; render(); }

async function toggleCheck(id, idx){
  if(!db) return;
  const c = contracts.find(x => x.id === id);
  if(!c) return;
  const status = c.status || {};
  const cur = status[idx] || {};
  const nowDone = !cur.done;
  status[idx] = { done: nowDone, doneAt: nowDone ? new Date().toISOString() : null };
  const history = (c.history || []).concat([{
    label: STAGES[idx].name + ' — ' + (nowDone ? 'انجام شد' : 'لغو شد'),
    time: new Date().toISOString()
  }]);
  await db.collection('contracts').doc(id).update({ status, history });
}

async function saveProgress(id, idx){
  if(!db) return;
  const c = contracts.find(x => x.id === id);
  if(!c) return;
  const range = document.getElementById(`range_${id}_${idx}`);
  const dateInput = document.getElementById(`date_${id}_${idx}`);
  const percent = parseInt(range.value, 10);
  const predictedDate = dateInput.value.trim();
  const status = c.status || {};
  status[idx] = { percent, predictedDate, updatedAt: new Date().toISOString(),
                   doneAt: percent >= 100 ? new Date().toISOString() : null };
  const history = (c.history || []).concat([{
    label: STAGES[idx].name + ' — پیشرفت ' + percent + '٪' + (predictedDate ? ' — پیش‌بینی: ' + predictedDate : ''),
    time: new Date().toISOString()
  }]);
  await db.collection('contracts').doc(id).update({ status, history });
}

async function deleteContract(id){
  if(!db) return;
  if(!confirm('این قرارداد حذف شود؟')) return;
  await db.collection('contracts').doc(id).delete();
}

function openAddModal(){ document.getElementById('newName').value = ''; document.getElementById('addModalBg').classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

async function addContract(){
  if(!db) return;
  const name = document.getElementById('newName').value.trim();
  if(!name) return;
  await db.collection('contracts').add({
    name: name,
    status: {},
    history: [{ label: 'قرارداد ثبت شد', time: new Date().toISOString() }],
    createdAt: Date.now()
  });
  closeModal('addModalBg');
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'block';
});
function installApp(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>

</body>
</html>
